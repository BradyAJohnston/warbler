[project]
name = "warbler"
version = "0.0.11"
description = "Interactive GPU simulations in Blender's viewport"
authors = [
    {name = "Brady Johnston", email = "brady.johnston@me.com"},
]
maintainers = [{ name = "Brady Johnston", email = "brady.johnston@me.com" }]
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = "~=3.13.0"
dependencies = [
    "newton>=1.6.0",
    "databpy>=0.10.1",
    "nodebpy>=520.38.0",
]

[project.urls]
Homepage = "https://bradyajohnston.github.io/warbler"
Repository = "https://github.com/bradyajohnston/warbler"
Documentation = "https://bradyajohnston.github.io/warbler"

[project.optional-dependencies]
bpy =  ["bpy>=5.2.0"]
dev = [
    "urllib3>=2.7.0",
    "bpy>=5.2.0",
    "pytest>=9.0.3",
    "fake-bpy-module>=20260501",
    "pytest-cov",
    "syrupy",
    "scipy",
    "ruff",
    "ty>=0.0.34",
    "urllib3>=2.6.3",
    "pre-commit",
    "molecularnodes>=520.3.0",
]
docs = ["quartodoc", "quarto-cli>=1.9", "tomlkit"]

[tool.uv.sources]
# 520.3.0 isn't on PyPI yet (520.2.0 needs an older nodebpy). Its node asset
# library isn't committed, but nodebpy builds the groups from source instead.
molecularnodes = { git = "https://github.com/BradyAJohnston/MolecularNodes", rev = "9059f03ad30778be0abdfc5b1afa641f40d7ce52" }

[tool.extbpy]
# Blender-specific metadata. `extbpy build` merges this with [project] to
# generate blender_manifest.toml and the per-platform extension zips.
pretty_name = "Warbler"
tagline = "Interactive GPU simulations in Blender's viewport"
blender_version_min = "5.2.0"
platforms = ["linux-x64", "windows-x64", "macos-arm64"]
tags = ["3D View", "Animation", "Bake", "Physics"]
copyright = ["2024 Brady Johnston"]

[tool.extbpy.permissions]
files = "Saving cached simulations to disk"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["warbler"]
omit = ["tests/*"]
