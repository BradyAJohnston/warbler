[project]
name = "warbler"
version = "0.0.10"
description = "Interactive GPU simulations in Blender's viewport"
authors = [
    {name = "Brady Johnston", email = "brady.johnston@me.com"},
]
maintainers = [{ name = "Brady Johnston", email = "brady.johnston@me.com" }]
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = "~=3.13.0"
dependencies = [
    "newton>=1.7.0",
    "databpy>=0.10.1",
    "nodebpy>=520.38.0",
]

[project.urls]
Homepage = "https://bradyajohnston.github.io/warbler"
Repository = "https://github.com/bradyajohnston/warbler"
Documentation = "https://bradyajohnston.github.io/warbler"

[project.optional-dependencies]
bpy =  ["bpy>=5.2.0"]
dev = [
    "urllib3>=2.7.0",
    "bpy>=5.2.0",
    "pytest>=9.0.3",
    "fake-bpy-module>=20260501",
    "pytest-cov",
    "syrupy",
    "scipy",
    "ruff",
    "ty>=0.0.34",
    "urllib3>=2.6.3",
    "pre-commit",
    "molecularnodes>=520.3.0",
]
docs = ["quartodoc", "quarto-cli>=1.9", "tomlkit"]

[tool.uv.sources]
# 520.3.0 isn't on PyPI yet (520.2.0 needs an older nodebpy). Its node asset
# library isn't committed, but nodebpy builds the groups from source instead.
molecularnodes = { git = "https://github.com/BradyAJohnston/MolecularNodes", rev = "9059f03ad30778be0abdfc5b1afa641f40d7ce52" }

[tool.extbpy]
# Blender-specific metadata. `extbpy build` merges this with [project] to
# generate blender_manifest.toml and the per-platform extension zips.
pretty_name = "Warbler"
tagline = "Interactive GPU simulations in Blender's viewport"
blender_version_min = "5.2.0"
platforms = ["linux-x64", "windows-x64", "macos-arm64"]
tags = ["3D View", "Animation", "Bake", "Physics"]
copyright = ["2024 Brady Johnston"]
# Built (python -m nodebpy.assets build), not committed
required_files = ["warbler/assets/nodes.blend"]
# Added to the default excludes (__pycache__/, .*, /*.zip)
paths_exclude_pattern = ["*.blend[1-9]", "*.stamp"]

[tool.extbpy.permissions]
files = "Saving cached simulations to disk"

# The node-asset pipeline (python -m nodebpy.assets build|dump|ensure|check):
# warbler/nodes/ is the source of truth, warbler/assets/nodes.blend the built,
# untracked asset library. See CLAUDE.md "Node groups".
[tool.nodebpy.assets]
source = "warbler/nodes"
blend = "warbler/assets/nodes.blend"
typed-api = true
add-reroutes = true
split-inputs = true

[tool.ruff.lint.per-file-ignores]
# Dumped by nodebpy: _tree_properties is a ClassVar on the nodebpy base, and
# the dump would overwrite an annotation or noqa added here
"warbler/nodes/geometry/*" = ["RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["warbler"]
omit = ["tests/*"]
